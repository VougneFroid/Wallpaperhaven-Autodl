<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Wallhaven Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="glass-header">
        <div class="header-content">
            <h1>Wallhaven<span>DL</span></h1>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search wallpapers... e.g. cyberpunk, anime" autocomplete="off">
                <select id="sortSelect">
                    <option value="relevance">Relevance</option>
                    <option value="date_added">Latest</option>
                    <option value="toplist">Top List</option>
                    <option value="random">Random</option>
                </select>
                <button id="searchBtn">Search</button>
                <button id="settingsBtn" title="Settings" style="padding: 0.8rem; display: flex; align-items: center; justify-content: center;">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="gallery-info" id="galleryInfo">
            <span id="resultCount">Find your perfect wallpaper</span>
        </div>
        
        <div class="gallery" id="gallery">
            <!-- Wallpapers will be injected here -->
        </div>

        <div class="loader" id="loader" style="display: none;">
            <div class="spinner"></div>
        </div>
        <div id="scrollSentinel" style="height: 1px;"></div>
    </main>

    <div class="action-bar" id="actionBar">
        <span class="selection-count"><span id="selectedCount">0</span> selected</span>
        <button class="clear-btn" id="clearBtn" title="Clear selection" aria-label="Clear selection">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <button class="download-btn" id="downloadBtn">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download Selected
        </button>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button id="closeSettingsBtn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="downloadDirInput">Download Directory</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="text" id="downloadDirInput" placeholder="e.g. downloads or /home/user/Pictures">
                        <button id="browseFolderBtn" type="button" style="padding: 0 1rem; width: auto;">Browse</button>
                    </div>
                    <small style="display:block; margin-top:0.5rem; color:var(--text-secondary);">Relative to the project folder, or provide an absolute path.</small>
                </div>
            </div>
            <div class="modal-footer">
                <button id="saveSettingsBtn" style="width: 100%;">Save Settings</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
